version: '3.9'

services:
  mongodb:
    image: mongo:7
    container_name: mongo_ilanlar
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: ilanlar_db
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ilanlar_network

  app:
    image: ${APP_IMAGE:-envai-kamuilan-app}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: job_app
    restart: unless-stopped
    ports:
      - "3003:3003"
    env_file:
      - .env
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - ilanlar_network

volumes:
  mongo_data:
  
networks:
  ilanlar_network:
    driver: bridge
