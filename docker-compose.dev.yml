version: "3.9"

services:
  mongodb:
    image: mongo:7
    container_name: mongo_ilanlar
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ilanlar_db
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "127.0.0.1:27017:27017"
    networks:
      - ilanlar_network

  warp:
    image: caomingjun/warp:latest
    container_name: warp
    restart: unless-stopped
    ports:
      - "127.0.0.1:1080:1080"
    environment:
      - WARP_SLEEP=2
    cap_add:
      - NET_ADMIN
      - MKNOD
      - AUDIT_WRITE
    device_cgroup_rules:
      - "c 10:200 rwm"
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv6.conf.all.disable_ipv6=0
    volumes:
      - ./data:/var/lib/cloudflare-warp
    networks:
      - ilanlar_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: job_app
    restart: unless-stopped
    ports:
      - "192.168.1.160:3003:3003"
    env_file:
      - .env
    environment:
      PDF_PROXY_URL: ${PDF_PROXY_URL:-socks5h://warp:1080}
    depends_on:
      mongodb:
        condition: service_healthy
      warp:
        condition: service_started
    networks:
      - ilanlar_network

volumes:
  mongo_data:

networks:
  ilanlar_network:
    driver: bridge
